<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haus Dellwig – Heimatmuseum Lütgendortmund</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="button-container">
            <a href="unternehmen.html" class="button button-pacific">
                <span>Zurück zur Übersicht</span>
            </a>
        </div>

        <!-- Bildanzeige (Slider) mit Wischen -->
        <div class="slider-container">
            <div class="slider" id="slider">
                <!-- Bilder werden dynamisch geladen -->
            </div>

            <div class="slider-controls">
                <button id="prevBtn">&lt;</button>
                <button id="nextBtn">&gt;</button>
            </div>

            <div class="slider-dots" id="dots"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Pfad zu den Bildern im Ordner /displays/content/documents/poster
            const imageFolder = '/displays/content/documents/poster/';
            const imageFiles = [
                'Pacific-1.jpg',
                'Pacific-2.jpg',
                'Pacific-3.jpg',
                'Pacific-4.jpg',
                'Pacific-5.jpg',
                'Pacific-6.jpg',
                'Pacific-7.jpg',
                'Pacific-8.jpg',
                'Pacific-9.jpg',
                'Pacific-10.jpg',
                'Pacific-11.jpg',
                'Pacific-12.jpg',
                'Pacific-13.jpg',
                'Pacific-14.jpg',
                'Pacific-15.jpg',
                'Pacific-16.jpg',
                'Pacific-17.jpg',
                'Pacific-18.jpg',
                'Pacific-19.jpg',
                'Pacific-20.jpg'
            ];

            const slider = document.getElementById('slider');
        const dotsContainer = document.getElementById('dots');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentSlide = 0;
        let isZoomed = false;
        let scale = 1;
        const minScale = 1;
        const maxScale = 3;
        const zoomStep = 0.2;

        // Initialisiere Slider
        function initSlider() {
            imageFiles.forEach((filename, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = imageFolder + filename;
                img.alt = `Poster ${index + 1}`;
                img.setAttribute('data-index', index);
                slide.appendChild(img);
                slider.appendChild(slide);

                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.setAttribute('data-index', index);
                if (index === 0) dot.classList.add('active');
                dotsContainer.appendChild(dot);
            });

            // Zoom-Event für Desktop (Klick)
            slider.addEventListener('click', function(e) {
                const img = e.target.closest('img');
                if (!img) return;

                if (isZoomed) {
                    // Zurückzoomen
                    img.style.transform = `translate(-50%, -50%) scale(1)`;
                    scale = 1;
                    isZoomed = false;
                    img.classList.remove('zoomed');
                } else {
                    // Zoomen
                    img.style.transform = `translate(-50%, -50%) scale(1.5)`;
                    scale = 1.5;
                    isZoomed = true;
                    img.classList.add('zoomed');
                }
            });

            // Touch-Zoom (Zwei-Finger)
            let touchStartDistance = 0;
            let touchStartScale = 1;

            slider.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    touchStartDistance = getDistance(e.touches[0], e.touches[1]);
                    touchStartScale = scale;
                }
            });

            slider.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const currentDistance = getDistance(e.touches[0], e.touches[1]);
                    const scaleDiff = currentDistance / touchStartDistance;
                    const newScale = touchStartScale * scaleDiff;

                    const img = slider.querySelector('img');
                    if (img) {
                        scale = Math.max(minScale, Math.min(maxScale, newScale));
                        img.style.transform = `translate(-50%, -50%) scale(${scale})`;
                    }
                }
            });

            // Zoom-Buttons
            prevBtn.addEventListener('click', () => goToSlide(currentSlide - 1));
            nextBtn.addEventListener('click', () => goToSlide(currentSlide + 1));

            // Dots
            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const index = parseInt(dot.getAttribute('data-index'));
                    goToSlide(index);
                });
            });

            // Wischen
            let startX = 0;
            slider.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            });
            slider.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (diff > 50) goToSlide(currentSlide + 1);
                else if (diff < -50) goToSlide(currentSlide - 1);
            });
        }

        // Hilfsfunktion: Distanz zwischen zwei Touch-Punkten berechnen
        function getDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Funktion zum Wechseln des Slides
        function goToSlide(index) {
            if (index < 0) index = imageFiles.length - 1;
            if (index >= imageFiles.length) index = 0;

            currentSlide = index;
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;

            // Aktualisiere Dots
            document.querySelectorAll('.dot').forEach((dot, i) => {
                if (i === index) dot.classList.add('active');
                else dot.classList.remove('active');
            });

            // Reset Zoom
            const img = slider.querySelector('img');
            if (img) {
                img.style.transform = `translate(-50%, -50%) scale(1)`;
                scale = 1;
                isZoomed = false;
                img.classList.remove('zoomed');
            }
        }

        // Starte Slider
        initSlider();
    });
    </script>
</body>
</html>
