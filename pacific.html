<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haus Dellwig – Heimatmuseum Lütgendortmund</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="button-container">
            <a href="unternehmen.html" class="button button-vereine">
                <span>Zurück zur Übersicht</span>
            </a>
        </div>

        <!-- Bildanzeige (Slider) mit Wischen -->
        <div class="slider-container">
            <div class="slider" id="slider">
                <!-- Bilder werden dynamisch geladen -->
            </div>

            <div class="slider-controls">
                <button id="prevBtn">&lt;</button>
                <button id="nextBtn">&gt;</button>
            </div>

            <div class="slider-dots" id="dots"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Pfad zu den Bildern im Ordner /displays/content/documents/poster
            const imageFolder = '/displays/content/documents/poster/';
            const imageFiles = [
                'Eine-Familie-schrieb-Industrie-Geschichte.jpg',
                'Eine-Familie-schrieb-Industrie-Geschichte-2.pdf',
                'poster3.jpg',
                'poster4.jpg',
                'poster5.jpg'
            ];

            const slider = document.getElementById('slider');
            const dotsContainer = document.getElementById('dots');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            let currentSlide = 0;
            const totalSlides = imageFiles.length;

            // Bilder und Dots dynamisch erstellen
            imageFiles.forEach((filename, index) => {
                // Slide hinzufügen
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = imageFolder + filename;
                img.alt = `Poster ${index + 1}`;
                slide.appendChild(img);
                slider.appendChild(slide);

                // Dot hinzufügen
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.setAttribute('data-index', index);
                if (index === 0) dot.classList.add('active');
                dotsContainer.appendChild(dot);
            });

            // Funktion zum Wechseln des Slides
            function goToSlide(index) {
                if (index < 0) {
                    index = totalSlides - 1;
                } else if (index >= totalSlides) {
                    index = 0;
                }

                currentSlide = index;
                slider.style.transform = `translateX(-${currentSlide * 100}%)`;

                // Aktualisiere die Dot-Indikatoren
                document.querySelectorAll('.dot').forEach((dot, i) => {
                    if (i === index) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }

            // Event-Listener für Pfeil-Buttons
            prevBtn.addEventListener('click', () => {
                goToSlide(currentSlide - 1);
            });

            nextBtn.addEventListener('click', () => {
                goToSlide(currentSlide + 1);
            });

            // Event-Listener für Dot-Indikatoren
            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const index = parseInt(dot.getAttribute('data-index'));
                    goToSlide(index);
                });
            });

            // Touch-Event für Wischen (für Mobilgeräte)
            let startX = 0;
            let endX = 0;

            slider.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            });

            slider.addEventListener('touchend', (e) => {
                endX = e.changedTouches[0].clientX;
                const diff = startX - endX;

                if (diff > 50) {
                    // Wischen nach links → nächstes Bild
                    goToSlide(currentSlide + 1);
                } else if (diff < -50) {
                    // Wischen nach rechts → vorheriges Bild
                    goToSlide(currentSlide - 1);
                }
            });
        });
    </script>
</body>
</html>
